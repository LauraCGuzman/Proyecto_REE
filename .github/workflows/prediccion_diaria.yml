name: Predicción diaria REE

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediccion-diaria-ree
  cancel-in-progress: false

jobs:
  predecir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar imports críticos
        run: |
          python -c "
          import pandas
          import sklearn
          import holidays
          import joblib
          from src import datos, features, modelo, paths
          print(f'scikit-learn {sklearn.__version__}')
          print(f'holidays {holidays.__version__}')
          "

      - name: Canario de paridad (deriva de dependencias)
        run: pytest tests/test_paridad.py

      - name: Predicción diaria
        env:
          API_ESIOS: ${{ secrets.API_ESIOS }}
        run: python pipeline/predecir.py

      - name: Commit y push de la predicción (COMMIT A)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predicciones.csv data/ancla_usada.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en data/predicciones.csv -- nada que commitear."
            exit 0
          fi
          git commit -m "chore: predicción diaria $(date -u +%Y-%m-%d)"
          git push

      - name: Evaluación diaria
        env:
          API_ESIOS: ${{ secrets.API_ESIOS }}
        run: python pipeline/evaluar.py

      - name: Commit y push de la evaluación (COMMIT B)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/errores.csv data/metricas.json reports/estado_pipeline.md
          if git diff --cached --quiet; then
            echo "Sin cambios en la evaluación -- nada que commitear."
            exit 0
          fi
          git commit -m "chore: evaluación diaria $(date -u +%Y-%m-%d)"
          git push
